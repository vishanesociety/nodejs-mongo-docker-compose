version: '3.8'

services:
  mongodb:
    image: mongo:6.0.6
    container_name: mymongo2
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - app-network
    healthcheck:
      test: [ "CMD", "sh", "-c", "echo 'db.runCommand({ping:1}).ok' | mongosh --quiet" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s     


  # Node.js Application Service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mynodejsmicroservice2
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${APP_PORT:-8080}
      DATABASE_URL: mongodb://mongodb:27017/BOOKS
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - app-network
    volumes:
      - ./logs:/usr/src/app/logs
    healthcheck:
      test: ["CMD", "node", "healthcheck.js"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

# Named volumes for data persistence
volumes:
  mongo_data:
    driver: local
  

# Custom network for service communication
networks:
  app-network:
    driver: bridge